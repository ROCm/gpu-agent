version: 2
multi-ecosystem-groups:
  gpuagent-build-and-go:
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
updates:
  - package-ecosystem: gomod
    directory: /sw/nic/gpuagent
    multi-ecosystem-group: gpuagent-build-and-go
    patterns:
      - "*"
    labels:
      - dependencies
      - security

  # ── GitHub Actions: keep workflow action versions current ──────────────────
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions keep their own `uses:`
    # pins, so .github/actions has to be listed separately to get bumped.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
