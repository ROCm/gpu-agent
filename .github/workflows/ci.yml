name: CI Build

on:
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Read Go version
        id: go-version
        run: |
          version=$(awk '$1 == "go" { print $2; exit }' sw/nic/gpuagent/go.mod)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build builder container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: tools/build-container
          file: tools/build-container/Dockerfile.rhel9
          load: true
          tags: gpuagent-builder-rhel:9
          build-args: |
            GO_VERSION=${{ steps.go-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build gpuagent
        id: build
        run: |
          # pipefail is on by default in Actions bash, so make's rc survives tee
          make gpuagent \
            GIT_COMMIT=$(git rev-list -1 HEAD --abbrev-commit) \
            BUILD_DATE=$(date +%Y-%m-%dT%H:%M:%S%z) \
            2>&1 | tee build.log

      - name: Scan gpuctl with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: sw/nic/build/x86_64/sim/bin/gpuctl
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-gpuctl

      - name: Build summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          BIN=sw/nic/build/x86_64/sim/bin
          {
            echo "## gpuagent build"
            echo ""
            echo "- status: **${BUILD_OUTCOME}**"
            echo "- commit: \`$(git rev-list -1 HEAD --abbrev-commit)\`"
            echo ""
            echo "| binary | size | sha256 |"
            echo "|---|---|---|"
            for b in gpuagent gpuagent_gim gpuagent_mock gpuctl; do
              if [ -f "$BIN/$b" ]; then
                sz=$(du -h "$BIN/$b" | cut -f1)
                sha=$(sha256sum "$BIN/$b" | cut -c1-12)
                echo "| $b | $sz | \`$sha\` |"
              else
                echo "| $b | — | **MISSING** |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gpuagent
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpuagent
          path: sw/nic/build/x86_64/sim/bin/gpuagent
          retention-days: 10
          if-no-files-found: warn

      - name: Upload gpuagent_gim
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpuagent_gim
          path: sw/nic/build/x86_64/sim/bin/gpuagent_gim
          retention-days: 10
          if-no-files-found: warn

      - name: Upload gpuagent_mock
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpuagent_mock
          path: sw/nic/build/x86_64/sim/bin/gpuagent_mock
          retention-days: 10
          if-no-files-found: warn

      - name: Upload gpuctl
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpuctl
          path: sw/nic/build/x86_64/sim/bin/gpuctl
          retention-days: 10
          if-no-files-found: warn

      - name: Upload build libs tree
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-libs
          path: sw/nic/build
          retention-days: 1
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-log
          path: build.log
          retention-days: 10
          if-no-files-found: warn

  build-wsl:
    name: Build WSL
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Read Go version
        id: go-version
        run: |
          version=$(awk '$1 == "go" { print $2; exit }' sw/nic/gpuagent/go.mod)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build builder container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: tools/build-container
          file: tools/build-container/Dockerfile.rhel9
          load: true
          tags: gpuagent-builder-rhel:9
          build-args: |
            GO_VERSION=${{ steps.go-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download pre-built third-party libs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-libs
          path: sw/nic/build

      - name: Build gpuagent-wsl (stub libamd_smi)
        id: build-wsl
        run: |
          make gpuagent_wsl_docker \
            GIT_COMMIT=$(git rev-list -1 HEAD --abbrev-commit) \
            BUILD_DATE=$(date +%Y-%m-%dT%H:%M:%S%z) \
            2>&1 | tee build-wsl.log

      - name: Build summary
        if: always()
        env:
          BUILD_WSL_OUTCOME: ${{ steps.build-wsl.outcome }}
        run: |
          BIN=sw/nic/build/x86_64/sim/bin
          {
            echo "## gpuagent-wsl build"
            echo ""
            echo "- status: **${BUILD_WSL_OUTCOME}**"
            echo "- commit: \`$(git rev-list -1 HEAD --abbrev-commit)\`"
            echo ""
            echo "| binary | size | sha256 |"
            echo "|---|---|---|"
            if [ -f "$BIN/gpuagent-wsl" ]; then
              sz=$(du -h "$BIN/gpuagent-wsl" | cut -f1)
              sha=$(sha256sum "$BIN/gpuagent-wsl" | cut -c1-12)
              echo "| gpuagent-wsl | $sz | \`$sha\` |"
            else
              echo "| gpuagent-wsl | — | **MISSING** |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gpuagent-wsl
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpuagent-wsl
          path: sw/nic/build/x86_64/sim/bin/gpuagent-wsl
          retention-days: 10
          if-no-files-found: warn

      - name: Upload build-wsl log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-wsl-log
          path: build-wsl.log
          retention-days: 10
          if-no-files-found: warn
